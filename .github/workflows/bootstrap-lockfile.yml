name: Bootstrap dependency lockfile

on:
  push:
    branches: [fix/restore-atomicity-dependency-lock]
    paths:
      - .github/workflows/bootstrap-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-atomicity-dependency-lock
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin fix/restore-atomicity-dependency-lock
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: add reproducible npm dependency lockfile"
            git push origin HEAD:fix/restore-atomicity-dependency-lock
          fi
